# Crawshrimp's user layer over DSH 0.2.1-rc.2's official Web profile.

# Keep the existing Crawshrimp identity and operating instructions, while the
# official standard preset continues to supply its full tool and workflow
# surface. The value comes from the desktop process and is never persisted to
# the staged package or user profile.
- id: system-prompt
  config:
    includeHarnessIdentity: false
    persona: !!js process.env.CRAWSHRIMP_AGENT_PERSONA ?? '你是抓虾智能体，运行在抓虾桌面应用中。输出语言：默认使用简体中文向用户沟通，包括可见的思考摘要、执行计划、阶段进度、工具调用的 description/title、任务清单与最终回答。思考摘要只需简短说明当前目标、下一步和已观察到的依据，不展开内部推理。不要只把最终答案翻成中文而让中间步骤保持英文。代码、命令、路径、文件名、API 字段和原始错误保留原文，必要时另用中文解释。用户明确指定其他语言或要求翻译时遵从其要求；英文工具文档、工具返回内容或历史英文进度不改变默认沟通语言。语言示例：开始时写“我先检查当前页面，再逐步核对结果”；阶段完成写“已完成第 1 步，接下来读取下一页”。工具参数 description/title 是给用户看的中文短句，例如“等待 12 秒并计算乘积”“创建验收文件夹”“读取并核对销售表”。工具定义中的英文示例仅说明格式，不要求填写英文；提交工具调用前检查这些说明字段的语言。'

# The agent plane has one product-owned composition.  Do not expose upstream
# or user-authored presets in this consumer product: every session runs the
# same Crawshrimp capability and persona contract.
- id: agent-preset-registry
  config:
    default: crawshrimp-standard

- id: preset-standard
  disabled: true
- id: preset-ptc
  disabled: true
- id: preset-minimal
  disabled: true
- id: preset-cordis
  disabled: true

- id: ptc-runtime
  config:
    # Fresh scope per call avoids Flash redeclaration failures in ecosystem workflows.
    executionMode: per-call
    # Match the MCP tool deadline: approval and media jobs can exceed two minutes.
    timeoutMs: 1800000
    maxTimeoutMs: 1800000

# The fixed product preset has no user-facing selector, session label, or
# settings page.  Keeping the upstream host plugin disabled also prevents the
# default preset from being changed through the embedded DSH interface.
- id: ui-agent-preset
  disabled: true

- id: agent-default-model
  config:
    provider: !!js process.env.CRAWSHRIMP_AGENT_PROVIDER ?? 'crawshrimp-deepseek-official'
    model: !!js process.env.CRAWSHRIMP_AGENT_MODEL ?? 'deepseek-flash'

