        models:
          - id: gpt-6.1-sol
            contextWindow: 256000
            maxTokens: 65536
            input: [text, image]
          - id: gpt-6-astra
            contextWindow: 256000
            maxTokens: 65536
            input: [text, image]
          - id: gpt-6-sol
            contextWindow: 256000
            maxTokens: 65536
            input: [text, image]
          - id: gpt-6-luna
            contextWindow: 256000
            maxTokens: 65536
            input: [text, image]
          - id: gpt-5.6-sol
            contextWindow: 256000
            maxTokens: 65536
            input: [text, image]
          - id: gpt-5.6-terra
            contextWindow: 256000
            maxTokens: 65536
            input: [text, image]
          - id: gpt-5.6-luna
            contextWindow: 256000
            maxTokens: 65536
            input: [text, image]
          - id: gpt-5.5
            contextWindow: 256000
            maxTokens: 65536
            input: [text, image]
          - id: gemini-3.1-pro-preview
            contextWindow: 1000000
            maxTokens: 65536
            input: [text, image]
          - id: gemini-3.5-flash
