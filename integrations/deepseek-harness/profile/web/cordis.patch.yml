      crawshrimp-glm-official:
        displayName: 智谱官方
        apiKeyEnv: CRAWSHRIMP_GLM_API_KEY
        api: openai-completions
        baseURL: !!js process.env.CRAWSHRIMP_GLM_BASE_URL ?? 'https://open.bigmodel.cn/api/paas/v4'
        models:
          - id: glm-5.3-flash
            contextWindow: 128000
            maxTokens: 8192
            input: [text, image]
          - id: glm-5.3
            contextWindow: 128000
            maxTokens: 16384
            # Paired GLM Flash supplies image descriptions through the Vision bridge.
            input: [text]
          - id: glm-5.2
            contextWindow: 128000
            maxTokens: 16384
            # Paired GLM Flash supplies image descriptions through the Vision bridge.
            input: [text]

- id: session-persistence-jsonl
  config:
    root: !!js process.env.CRAWSHRIMP_SESSION_ROOT ?? dshHomePath('sessions')

- id: attachment-local
  config:
    # Accept high-resolution source photos; model request normalization is separate.
    maxImageDimension: 8192
    maxImageBytes: 16777216

- id: sandbox-policy
  config:
    mode: !!js process.env.DSH_PERMISSION_MODE ?? 'workspace-write'
    workspaceRoot: !!js process.env.CRAWSHRIMP_WORKSPACE_ROOT ?? process.cwd()

- id: approval
  config:
    policy: !!js "(process.env.DSH_PERMISSION_MODE ?? 'workspace-write') === 'danger-full-access' ? 'never' : 'ask'"

- id: permission
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never

# The official Web bundle ships the Schedule UI dormant. Crawshrimp explicitly
# retains the full plan/task surface: durable schedules remain inside the same
# local DSH profile and therefore share its workspace, session, approval, and
# permission-preset boundaries. This is an enablement only; it creates no
# schedule and sends no unattended external message by itself.
- insert:
    - id: time-context
      name: '@deepseek-ai/dsh-time-context'
      config:
        refreshIntervalMs: 0

    - id: schedule
      name: '@deepseek-ai/dsh-schedule'

- id: ui-schedule
  disabled: false

# The upstream Web profile hides the operational rows until a host opts in.
# Crawshrimp's standard agent is a real local workbench, not a chat-only Web
# shell: restore the complete user-requested execution plane while retaining
# the existing sandbox, approval and permission-preset controls above.
#
# Keep the platform-specific PowerShell implementation and internal HMR /
# compaction helpers at their upstream defaults.  The enabled rows below cover
# Bash, file read/write/search, instructions, tasks/plans, skills, workflows,
# subagents. Web Preview / web_fetch are deliberately disabled below: every
# webpage task belongs to the product's Crawshrimp CDP + skill route.
- id: agent-instructions
  disabled: false

- id: command-goal
  disabled: false

- id: plan-mode
  disabled: false

- id: skill-filesystem
  disabled: false

- id: tool-bash
  disabled: false

- id: tool-fs
  disabled: false

- id: tool-fs-search
  disabled: false

- id: tool-str-replace-editor
  disabled: false

- id: tool-skill
  disabled: false

- id: tool-goal
  disabled: false

- id: tool-todo
  disabled: false

- id: tool-jobs
  disabled: false

- id: tool-subagent
  disabled: false

- id: tool-subagent-fork
  disabled: false

- id: tool-subagent-control
  disabled: false

- id: tool-subagent-list-agents
  disabled: false

- id: tool-workflow
  disabled: false

- id: workflow-worker-thread
  disabled: false

- id: tool-web
  disabled: true

# Official-only Messages transport. Other gateways remain on pi-ai.
- id: llm-deepseek
  disabled: false
  config:
    apiKeyEnv: CRAWSHRIMP_DEEPSEEK_API_KEY
    baseURL: https://api.deepseek.com/anthropic
    reasoningEffort: high

- id: llm-deepseek-account
  disabled: true

# The official wordmark is presentation-only. Keep the complete official Web
# capability roster, but let the Crawshrimp client slot own this product's
# visible identity.
- id: ui-brand-official
  disabled: true

# Crawshrimp owns model-provider setup and credential storage.  The upstream
# Models client registers its own first-run internal-test notice and a
# DeepSeek-only key dialog, neither of which describes the product's provider
# choices.  Disabling the browser-only row leaves the full runtime model
# routing in llm-pi-ai intact; the shell presents Crawshrimp's provider guide
# and opens its existing settings UI instead.
- id: ui-settings-models
  disabled: true

# Harness supplies labels for every model family, including managed routes.
- id: ui-deepseek-model-label-1017
  disabled: true

- id: xmanrui-dsh-im
  disabled: true

- insert:
    - id: mcp-crawshrimp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: streamable-http
        serverName: crawshrimp
        url: !!js process.env.CRAWSHRIMP_MCP_URL ?? 'http://127.0.0.1:18965/mcp'
        headers: !!js |
          ({ Authorization: 'Bearer ' + (process.env.CRAWSHRIMP_MCP_TOKEN ?? '') })
        toolCallTimeoutMs: 1800000
        failOnStartupError: !!js process.env.CRAWSHRIMP_STAGE_BOOT_CHECK !== '1'

    - id: crawshrimp-product-bridge
      name: 'crawshrimp-product-bridge'

    - id: crawshrimp-slots
      name: 'crawshrimp-slots'

    # Load after the Crawshrimp Host guard, so every IM connector sees the
    # workspace/approval policy before it registers its loopback RPC routes.
    - id: crawshrimp-dsh-im
      name: '@xmanrui/dsh-im'
      config:
        language: zh
        rpcAuthority: loopback
        feishu:
          workspace: !!js process.env.CRAWSHRIMP_WORKSPACE_ROOT ?? process.cwd()
        weixin:
          workspace: !!js process.env.CRAWSHRIMP_WORKSPACE_ROOT ?? process.cwd()
        dingtalk:
          workspace: !!js process.env.CRAWSHRIMP_WORKSPACE_ROOT ?? process.cwd()
        wecom:
          workspace: !!js process.env.CRAWSHRIMP_WORKSPACE_ROOT ?? process.cwd()
        qq:
          workspace: !!js process.env.CRAWSHRIMP_WORKSPACE_ROOT ?? process.cwd()
        slack:
          workspace: !!js process.env.CRAWSHRIMP_WORKSPACE_ROOT ?? process.cwd()
        telegram:
          workspace: !!js process.env.CRAWSHRIMP_WORKSPACE_ROOT ?? process.cwd()
        discord:
          workspace: !!js process.env.CRAWSHRIMP_WORKSPACE_ROOT ?? process.cwd()
        whatsapp:
          workspace: !!js process.env.CRAWSHRIMP_WORKSPACE_ROOT ?? process.cwd()
        office:
          workspace: !!js process.env.CRAWSHRIMP_WORKSPACE_ROOT ?? process.cwd()

# Product history search is an explicit opt-in; initialize only on first search.
- id: session-query-sqlite
  config:
    path: ':memory:'
    openAt: first-search

# Harness provides the session file opener. The sidebar services remain mounted
# for chat/skills; C06 suppresses only their duplicate embedded UI surface.
- id: ui-open-in-app
  disabled: true

# Generated Crawshrimp preset declaration (source: agent-presets/crawshrimp-standard/agent.cordis.yml)
- insert:
    - id: preset-crawshrimp-standard
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: crawshrimp-standard
        name: 抓虾工作模式
        plugins:
          # Crawshrimp's full-capability standard preset.
          #
          # This is deliberately a product-owned copy of DSH 0.2.1-rc.2's `standard` preset.
          # Presets are the agent plane, so the upstream `standard` persona would shadow
          # the host-layer product prompt. Keep the complete operational roster here and
          # replace only that scoped persona.

          - id: crawshrimp-memory
            name: 'crawshrimp-product-bridge/lib/memory.js'

          - id: crawshrimp-context-tools
            name: 'crawshrimp-product-bridge/lib/context-tools.js'
            config:
              mode: !!js process.env.CRAWSHRIMP_TOOL_CONTEXT ?? 'compact'

          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: !!js process.env.CRAWSHRIMP_AGENT_PERSONA ?? "你是抓虾智能体。输出语言：默认使用简体中文向用户沟通，包括可见的思考摘要、执行计划、阶段进度、工具调用的 description/title、任务清单与最终回答。思考摘要只需简短说明当前目标、下一步和已观察到的依据，不展开内部推理。不要只把最终答案翻成中文而让中间步骤保持英文。代码、命令、路径、文件名、API 字段和原始错误保留原文，必要时另用中文解释。用户明确指定其他语言或要求翻译时遵从其要求；英文工具文档、工具返回内容或历史英文进度不改变默认沟通语言。语言示例：开始时写“我先检查当前页面，再逐步核对结果”；阶段完成写“已完成第 1 步，接下来读取下一页”。工具参数 description/title 是给用户看的中文短句，例如“等待 12 秒并计算乘积”“创建验收文件夹”“读取并核对销售表”。工具定义中的英文示例仅说明格式，不要求填写英文；提交工具调用前检查这些说明字段的语言。桌面自动化必须先 skill_read('crawshrimp-computer-use/SKILL.md') 并使用内置 computer_use.py 观察、执行和读回；Electron 原生菜单/文件框属于桌面，渲染网页属于 CDP。所有网页任务必须使用抓虾 CDP 浏览器通道：先 skill_read('crawshrimp-skill/SKILL.md'),再使用 browser_observe/browser_navigate/browser_eval/browser_act/browser_verify/browser_capture_requests 或抓虾适配器。禁止调用 DSH 原生 web_search 或 web_fetch，也不得在 CDP 失败时静默降级到它们；应如实报告 CDP 连接或页面错误。用户询问身份、能力或如何开始使用抓虾智能体时，提供完整的新用户引导：说明身份、能力范围、三步上手方法与可直接复制的示例 prompt；普通“你好”保持简短。shell/bash生成文件后用artifact_present(paths=[绝对路径])登记交付；Office仍使用office_deliver完成原数据和视觉验收。若工具以 run_code/PTC 提供：每次代码独立运行，不保留前次变量或函数，所需值应从工具/任务记录读回；先 await enable_tools 获取真实工具名称，再调用工具。只有彼此独立的只读操作可并行；审批、任务执行和媒体生成需顺序等待。task_run、image_generate、video_generate 等可能等待审批或长任务的调用，run_code 使用 timeoutMs=1800000。超时不等于任务失败，先查任务状态/素材记录，禁止盲目重复提交。"

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              bundledSkillDir: !!js process.env.CRAWSHRIMP_SKILL_ROOT ?? process.env.DSH_BUNDLED_SKILL_DIR

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'

          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'

          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                        You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                        Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                        The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                        Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                        Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                        When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'

              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true

              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork

              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  maxDepth: provider-managed

              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  maxDepth: provider-managed

              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn

              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'

              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                config:
                  subagentProvider: spawn
                  maxRounds: 64

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            disabled: true
            config:
              fetch: true
              searchTimeoutMs: 60000

          # Opt-in programmatic tool calls keep the same product preset and permissions.
          # Native tool schemas remain the desktop default until per-model PTC rollout.
          - id: tool-presentation
            name: '@deepseek-ai/dsh-agent-tool-presentation'
            config:
              mode: !!js "process.env.CRAWSHRIMP_PTC_TOOLS === '1' ? 'ptc' : 'native'"
