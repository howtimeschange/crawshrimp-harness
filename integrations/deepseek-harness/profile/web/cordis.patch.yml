        api: anthropic-messages
        baseURL: !!js process.env.CRAWSHRIMP_OVERSEAS_ANTHROPIC_BASE_URL ?? 'https://ai-aigw.semir.com/overseas-anthropic-vip'
        models:
          - id: claude-opus-4-8
            contextWindow: 256000
            maxTokens: 64000
            input: [text, image]
          - id: claude-sonnet-5
            contextWindow: 256000
            maxTokens: 64000
            input: [text, image]
      crawshrimp-domestic-openai:
        displayName: 抓虾-国内 OpenAI 兼容
        apiKeyEnv: CRAWSHRIMP_DOMESTIC_OPENAI_API_KEY
        api: openai-completions
        baseURL: !!js process.env.CRAWSHRIMP_DOMESTIC_OPENAI_BASE_URL ?? 'https://ai-aigw.semir.com/bailian-codingplan/v1'
        models:
          - id: qwen3.8-max
            contextWindow: 256000
            maxTokens: 32768
            input: [text, image]
          - id: qwen3.8-max-preview
            contextWindow: 256000
            maxTokens: 32768
            input: [text, image]
          - id: qwen3.7-plus
            contextWindow: 256000
            maxTokens: 32768
            input: [text, image]
          - id: deepseek-v4.1-flash
            contextWindow: 256000
            maxTokens: 32768
            input: [text, image]
            reasoningEfforts: !!js "(process.env.CRAWSHRIMP_DOMESTIC_OPENAI_BASE_URL ?? 'https://ai-aigw.semir.com/bailian-codingplan/v1').replace(/\\/$/, '') === 'https://ai-aigw.semir.com/bailian-codingplan/v1' ? { off:'off', low:'low', high:'high', max:'max' } : false"
            compat:
              thinkingFormat: deepseek
              supportsReasoningEffort: true
              requiresReasoningContentOnAssistantMessages: true
          - id: deepseek-v4-flash
            contextWindow: 256000
            maxTokens: 32768
            input: [text, image]
            reasoningEfforts: !!js "(process.env.CRAWSHRIMP_DOMESTIC_OPENAI_BASE_URL ?? 'https://ai-aigw.semir.com/bailian-codingplan/v1').replace(/\\/$/, '') === 'https://ai-aigw.semir.com/bailian-codingplan/v1' ? { off:'off', low:'low', high:'high', max:'max' } : false"
            compat:
              thinkingFormat: deepseek
              supportsReasoningEffort: true
              requiresReasoningContentOnAssistantMessages: true
          - id: deepseek-v4-pro
            contextWindow: 256000
            maxTokens: 32768
            input: [text, image]
            reasoningEfforts: !!js "(process.env.CRAWSHRIMP_DOMESTIC_OPENAI_BASE_URL ?? 'https://ai-aigw.semir.com/bailian-codingplan/v1').replace(/\\/$/, '') === 'https://ai-aigw.semir.com/bailian-codingplan/v1' ? { off:'off', low:'low', high:'high', max:'max' } : false"
            compat:
              thinkingFormat: deepseek
              supportsReasoningEffort: true
              requiresReasoningContentOnAssistantMessages: true
          - id: glm-5.2
            contextWindow: 256000
            maxTokens: 32768
            input: [text, image]
          - id: kimi-k3
            contextWindow: 256000
            maxTokens: 32768
